<div class="card h-100 border-0 shadow-sm">
    <div class="card-body text-center p-4">
        <div class="avatar mx-auto mb-3">{{ card.name|slice:":1" }}</div>
        <h5 class="card-title mb-1">{{ card.name }}</h5>
        <p class="text-primary mb-2">{{ card.profession }}</p>
        <p class="text-muted small mb-3">{{ card.location }}</p>
        <p class="card-text small">{{ card.description }}</p>
    </div>
    <div class="card-footer bg-white border-0 pb-4 text-center">
        <a href="#" class="btn btn-outline-primary btn-sm">Vizitkani ko‘rish</a>
    </div>
</div>
