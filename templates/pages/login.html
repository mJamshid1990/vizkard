{% extends "base.html" %}

{% block title %}Kirish - Vizkard.uz{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-1">Kirish</h1>
                    <p class="text-muted small mb-4">Vizitkangizni boshqarish uchun hisobingizga kiring.</p>

                    <form>
                        <div class="mb-3">
                            <label for="login" class="form-label">Telefon raqami yoki email</label>
                            <input type="text" class="form-control" id="login" placeholder="+998 90 123 45 67 yoki email@example.com">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Parol</label>
                            <input type="password" class="form-control" id="password" placeholder="Parolingizni kiriting">
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label" for="remember">Meni eslab qol</label>
                        </div>

                        <button type="button" class="btn btn-primary w-100">Kirish</button>
                    </form>

                    <div class="text-center mt-3 small">
                        <a href="#" class="text-decoration-none">Parolni unutdingizmi?</a>
                    </div>
                    <hr>
                    <p class="text-center small mb-0">
                       Hisobingiz yo‘qmi? <a href="{% url 'pages:register' %}" class="text-decoration-none">Ro‘yxatdan o‘tish</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
